name: Build and deploy website

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify dist output
        run: ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-site
          path: dist/
          if-no-files-found: error

  check:
    name: Run checks (Astro, ESLint, Prettier)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Astro and ESLint checks
        run: npm run check:astro && npm run check:eslint

  deploy:
    name: Deploy to OVH
    needs: [build, check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-site
          path: dist/

      - name: Upload site over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          local-dir: ./dist/
          server: 193.227.116.207
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_passwd }}